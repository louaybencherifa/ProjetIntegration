mutation redeemCoupon(
  $id: UUID!
  $supplierId: UUID!
  $redeemedAt: Timestamp!
  $paymentId: String!
  $paymentDate: Date!
  $amount: Float!
  $notifyUserId: String!
) @auth(level: USER) {
  coupon_update(
    key: { id: $id }
    data: { status: USED, redeemedBy: { id: $supplierId }, redeemedAt: $redeemedAt }
  )
  payment_insert(data: {
    paymentId: $paymentId
    kind: SUPPLIER_REIMBURSEMENT
    relatedRef: $paymentId
    supplier: { id: $supplierId }
    amount: $amount
    date: $paymentDate
  })
  notification_insert(data: {
    user: { id: $notifyUserId }
    title: "Remboursement créé"
    message: "Un remboursement interne est en attente de validation."
  })
}

