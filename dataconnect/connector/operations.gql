mutation assignCouponToAidRequest(
  $couponId: UUID!
  $familyId: UUID!
  $aidRequestId: UUID!
  $notifyUserId: String!
  $notificationMessage: String!
) @auth(level: USER) {
  coupon_update(
    key: { id: $couponId }
    data: {
      family: { id: $familyId }
      aidRequest: { id: $aidRequestId }
      status: RESERVED
    }
  )
  notification_insert(data: {
    user: { id: $notifyUserId }
    title: "Coupon attribué"
    message: $notificationMessage
  })
}

