mutation updateSupplierOrderStatus(
  $id: UUID!
  $status: OrderStatus!
  $notifyUserId: String!
  $actorId: String!
  $targetRef: String!
  $statusText: String!
) @auth(expr: "auth.uid == vars.actorId") {
  serviceOrder_update(key: { id: $id }, data: { status: $status })
  notification_insert(data: {
    user: { id: $notifyUserId }
    title: "Mise à jour de votre commande"
    message: "Le partenaire a mis à jour le statut de votre commande."
  })
  auditLog_insert(data: {
    user: { id: $actorId }
    action: "ORDER_STATUS_CHANGED"
    targetRef: $targetRef
    details: $statusText
  })
}

query listAuditLogs @auth(level: USER) {
  auditLogs(orderBy: [{ performedAt: DESC }]) {
    id
    action
    performedAt
    targetRef
    details
    user { fullName email }
  }
}

mutation createAuditLog(
  $userId: String!
  $action: String!
  $targetRef: String
  $details: String
) @auth(expr: "auth.uid == vars.userId") {
  auditLog_insert(data: {
    user: { id: $userId }
    action: $action
    targetRef: $targetRef
    details: $details
  })
}

mutation markDonationVerified(
  $id: UUID!
  $status: DonationStatus!
  $verificationNote: String
  $notifyUserId: String!
  $notificationMessage: String!
) @auth(level: USER) {
  donation_update(
    key: { id: $id }
    data: { status: $status, verificationNote: $verificationNote }
  )
  notification_insert(data: {
    user: { id: $notifyUserId }
    title: "Mise à jour de votre don"
    message: $notificationMessage
  })
}