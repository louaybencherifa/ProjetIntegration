query getUserById($id: String!) @auth(expr: "auth.uid == vars.id") {
  users(where: { id: { eq: $id } }, limit: 1) {
    id
    role
    fullName
    email
    phone
    region
    address
    active
    twoFactorEnabled
    notifyEmailSms
    whatsappReminders
    createdAt
  }
}

mutation upsertUserProfile(
  $id: String!
  $role: UserRole!
  $fullName: String!
  $email: String!
) @auth(expr: "auth.uid == vars.id && (vars.role == 'DONOR' || vars.role == 'BENEFICIARY' || vars.role == 'SUPPLIER')") {
  user_upsert(data: {
    id: $id
    role: $role
    fullName: $fullName
    email: $email
  })
}

mutation updateUserSettings(
  $id: String!
  $fullName: String!
  $phone: String
  $region: String
  $address: String
  $notifyEmailSms: Boolean!
  $whatsappReminders: Boolean!
) @auth(expr: "auth.uid == vars.id") {
  user_update(
    key: { id: $id }
    data: {
      fullName: $fullName
      phone: $phone
      region: $region
      address: $address
      notifyEmailSms: $notifyEmailSms
      whatsappReminders: $whatsappReminders
    }
  )
}

query listDonationsForUser($userId: String!) @auth(expr: "auth.uid == vars.userId") {
  donations(
    where: { donor: { user: { id: { eq: $userId } } } }
    orderBy: [{ submittedAt: DESC }]
  ) {
    reference
    amount
    donorName
    donorEmail
    submittedAt
    method
    status
    receiptImage
    association { name }
    campaign { name }
  }
}

query getDonorContext($userId: String!) @auth(expr: "auth.uid == vars.userId") {
